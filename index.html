<!DOCTYPE html>

<html>

<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="style.css"/>
  <title>BackOS</title>
</head>

<body class="body">




<div class="topBar" id="top">
  <p>
    BackOS
  </p>
    <img src="images/infinity_free_symbol.png" id="welcomeopen" class="infinitySymbol">
  <p id="timeElement">
    Time
  </p>
</div>


<div id="welcome" class="welcomeWindow">

  <div id="welcomeheader" class="titlebar">
    Level_0.exe
    <button id="welcomeclose" class="close-btn">
    X
    </button>
  </div>



  <p class="mainWindowTitle">
    BackOS is ready
  </p>

  <p>
    This OS is used on all naturally generated computers in the backrooms
  </p>

  <br>

  <img src="images/windows_xp.jpg" class="welcomeSlideshow" id="welcomeSlideshow">

  <br>  
  <p class="welcomeSlideshowCaption" id="welcomeSlideshowCaption">
    Level 287-'Windows XP'
  </p>
</div>






<div style="padding-top: 64px;padding-left:16px;">
  <div class="notes_App";>
      <img src="images/backrooms_notes_icon.jpg" class="notes_icon" id="notesIcon">
      <p style="margin:0px;">
       Notes.exe
      </p>
  </div>
  <div class="keypadApp">
      <img src="images/padlockIcon.png" class="keypadIcon" id="keypadIcon">
      <p style="margin:0px;">
       keypad.exe
      </p>
  </div>
</div>




<div id="notes" class="notesWindow" style="display:none" >

  <div id="notesheader" class="notesTitlebar">
      <div id="notesTabs" class="folderTabs">
      </div>
    <button id="deleteNote">-</button>
    <button id="newNote">+</button>
    <button id="notesclose" class="close-btn">X</button>
  </div>



  <div id="notesContent" class="folderPage">
  </div>

</div>

<div id="keypad" class="keypadWindow" style="display:none">
  <div id="keypadheader" class="titlebar">
    keypad.exe
    <button id="keypadclose" class="close-btn">
    X
    </button>
  </div>
      <p id="keypadDisplay" style="margin:0px;">
       _ _ _ _
      </p>
      <div class="keypadGrid">
        <button class="keypadKey">1</button>
        <button class="keypadKey">2</button>
        <button class="keypadKey">3</button>
        <button class="keypadKey">4</button>
        <button class="keypadKey">5</button>
        <button class="keypadKey">6</button>
        <button class="keypadKey">7</button>
        <button class="keypadKey">8</button>
        <button class="keypadKey">9</button>
        <button class="keypadAction" id="keypadClear">C</button>
        <button class="keypadKey">0</button>
        <button class="keypadAction" id="keypadEnter">✓</button>

      </div>
      <div id="keypadUnlocked" style="display: none">
        <p>You escaped.</p>
      </div>
</div>









<script src="js/windows.js"></script>
<script src="js/effects.js"></script>
<script src="js/welcome.js"></script>
<script src="js/notes.js"></script>
<script src="js/keypad.js"></script>
</body>

</html>
